plugins {
	id "se.bjurr.gradle.bundle-jar" version "2.3.0"
}

javaExtension {
	javaVersion = 17
}

dependencies {
	api "se.bjurr.violations:violation-comments-lib:1.109.2"
	api "com.jayway.jsonpath:json-path:3.0.0"
	api "net.minidev:json-smart:2.6.0"
	api "tools.jackson.core:jackson-databind:3.2.2"
	api 'org.apache.httpcomponents:httpclient:4.5.14'

	testImplementation "org.junit.jupiter:junit-jupiter:6.1.3"
	testImplementation "org.assertj:assertj-core:3.27.7"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher:6.1.3"
}
